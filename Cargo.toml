[package]
name = "nubi-agent"
version = "0.1.0"
edition = "2021"
description = "Run coding agents (Claude Code, Codex, Gemini, ...) that respond to nubi room messages"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
eventsource-client = "0.13"
futures = "0.3"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
axum = "0.8"
tokio-test = "0.4"
tempfile = "3"
